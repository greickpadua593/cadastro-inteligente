</head>
<body>
    <div id="card">
        <div id="titulo">
            <h1>👾🤖Cadastro Escolar</h1>
            <h3>Preencha os seus dados para realizar o cadastro</h3>
        </div>

        <div class="campos">
            <label for="">👤Nome</label>
            <input type="text">
        </div>

        <div class="campos">
            <label for="">✉️Email</label>
            <input type="email">
        </div>

        <div class="campos">
            <label for="">🔑Senha</label>
            <input type="password">
        </div>

<div id="regras">
    <h2>🔎Regras da senha</h2>
    <p>🕛Pelo menos 8 caracteres</p>
    <p>🕛Pelo menos uma letra MAIÚSCULA</p>
    <p>🕛Pelo menos um número</p>
</div>

<div>
    <input type="submit" value="cadastrar" id="botao">
</div>
    </div>
